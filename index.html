<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Daily News</title>
    <link
      rel="stylesheet"
      href="fontawesome-free-6.4.0-web\fontawesome-free-6.4.0-web\css\all.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="body">
    <!-- header -->

    <header>
      <div class="logo">
        <a href="#" class="logo-name">The Daily News</a>
      </div>

      <div class="input-box">
        <i class="fas fa-magnifying-glass" id="btn"></i>
        <input
          type="text"
          name="Search"
          id="search"
          placeholder="Search insight..."
          autofocus />
      </div>

      <div class="mode-btn">
        <div class="mode-icon"><i class="fas fa-moon"></i></div>
      </div>
    </header>

    <!-- sidebar -->

    <div class="sidebar">
      <div class="sidebar-title">
        <div class="title">Categories</div>
        <div class="subtitle">The Daily News</div>
      </div>

      <nav class="nav-menu">
        <ul class="nav-list">
          <li class="nav-item"><i class="fas fa-briefcase"></i> Business</li>
          <li class="nav-item"><i class="fas fa-microchip"></i> IA</li>
          <li class="nav-item"><i class="fas fa-chart-line"></i> Economie</li>
          <li class="nav-item"><i class="fas fa-laptop"></i> Technologie</li>
          <li class="nav-item"><i class="fas fa-globe-africa"></i> Monde</li>
          <li class="nav-item"><i class="fas fa-users"></i> Société</li>
          <li class="nav-item"><i class="fas fa-rocket"></i> Startups</li>
          <li class="nav-item"><i class="fas fa-landmark"></i> Politique</li>
        </ul>
      </nav>
    </div>

    <main id="card-container">
      <h1>find anything you want</h1>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
